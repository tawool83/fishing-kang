<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#9ED9F0" />
    <!-- Plan §9 / Design §7 — 방 페이지는 검색에 노출하지 않는다 -->
    <meta name="robots" content="noindex" />
    <meta name="description" content="지인끼리 낚시 조과를 실시간으로 기록하고 겨루는 웹" />
    <!--
      단톡방·SNS 링크 미리보기 카드.
      여기 있는 값이 기본이고, 초대 링크(/r/:CODE)에서만 워커가 문구를 초대장으로
      바꿔 끼운다 (src/presentation/worker/og.ts). 이미지는 절대 URL이어야 해서
      도메인을 박는다 — 원본은 scripts/og-card.html.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="강태공" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="강태공 — 지인끼리 겨루는 낚시 조과 실시간 랭킹" />
    <meta
      property="og:description"
      content="방 만들고 링크만 뿌리면 끝. 가입 없이 실시간으로 순위가 올라가요."
    />
    <meta property="og:url" content="https://fish.allegru.dev/" />
    <meta property="og:image" content="https://fish.allegru.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="바다에서 청새치가 뛰어오르는 그림과 강태공 제목" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="강태공 — 지인끼리 겨루는 낚시 조과 실시간 랭킹" />
    <meta
      name="twitter:description"
      content="방 만들고 링크만 뿌리면 끝. 가입 없이 실시간으로 순위가 올라가요."
    />
    <meta name="twitter:image" content="https://fish.allegru.dev/og.png" />

    <title>강태공</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
