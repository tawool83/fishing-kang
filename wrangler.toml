# 강태공 — Cloudflare Workers 설정
# Design Ref: §2.1 — 방 1개 = Durable Object 1개. 정적 자산 + API + DO를 한 번에 배포.
#
# NOTE: module-1 시점의 골격이다. DO 클래스(RoomDurableObject)와 마이그레이션은
#       module-2에서 실제 구현과 함께 활성화한다.

name = "gangtaegong"
main = "src/presentation/worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# 커스텀 도메인. allegru.dev 존이 같은 계정에 있어야 하며,
# 첫 deploy 때 DNS 레코드와 인증서가 자동 생성된다.
[[routes]]
pattern = "fish.allegru.dev"
custom_domain = true

# 배포 후 대시보드에서 에러·로그를 볼 수 있게 한다
[observability]
enabled = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
# Design Ref: §10.3
APP_ORIGIN = "https://fish.allegru.dev"
# 방 수명(낚시 3일 · 정정 24h · 열람 7일)은 도메인 상수다 — src/domain/rules/roomLifecycle.ts
COOLDOWN_MS = "10000"    # Plan FR-10 — +1 쿨다운, 사람 단위

[[durable_objects.bindings]]
name = "ROOM_DO"
class_name = "RoomDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]
